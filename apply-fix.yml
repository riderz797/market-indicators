name: Apply seasonality fix

# ONE-OFF. Applies the current-year seasonality bake fix, then rebakes the data
# so the boards are correct immediately. Run it once from the Actions tab,
# confirm the boards look right, then delete this file.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

