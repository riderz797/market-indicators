      - name: Apply patch
        run: |
          git apply --check /tmp/fix.patch
          git apply /tmp/fix.patch
          git --no-pager diff --stat

      - name: Rebake seasonality with the current year
        run: python bake_seasonality.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "Nothing changed - the patch may already be applied"
            exit 1
          fi
          git commit -m "Bake current year for seasonality; drop dead CORS proxies"
          git push
