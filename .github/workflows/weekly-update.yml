name: Weekly Indicator Update

on:
  schedule:
    - cron: '0 8 * * 1'   # Every Monday at 8:00 AM UTC
  workflow_dispatch:       # Allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas yfinance matplotlib xlrd

      - name: Run US Business Cycle update
        continue-on-error: true   # FRED outages must not abort downstream steps
        run: python fetch_usbc.py

      - name: Run Fiscal Dominance Debt Spiral update
        continue-on-error: true
        run: python fetch_fdds.py

      - name: Run Snider Signal Board update
        continue-on-error: true
        # Writes indicators/macro/snider_data.json. Individual sources degrade
        # to empty rather than aborting, but the run fails hard if T5YIFR is
        # missing — Board 1 carries the framework's core argument.
        run: python fetch_snider.py

      - name: Run rebuild_all (all other indicators)
        continue-on-error: true
        run: python rebuild_all.py

      - name: Run Capital Flows update
        continue-on-error: true
        run: python fetch_capital_flows.py

      - name: Bake cross-asset seasonality data
        continue-on-error: true
        # Writes data/seasonality/*.json for the S&P 500, Bitcoin, gold, Brent
        # and Case-Shiller. Each asset is fetched independently and a failure
        # leaves that asset's existing file in place, so one bad source does
        # not take the page down.
        run: python bake_seasonality.py

      - name: Bake capability portfolio price CSVs
        continue-on-error: true
        run: python fetch_capability_data.py

      - name: Commit and push updated indicators
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add indicators/ scripts/ data/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly indicator update $(date +'%a %m/%d/%Y')"
            git push
          fi
