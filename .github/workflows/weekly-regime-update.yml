name: Weekly Regime Compass Update

# Recomputes the 42 Macro "Darius Dale" regime compass:
#   * fundamental GRID quadrant from FRED growth/inflation data
#   * share-of-confirming-markets from a Yahoo Finance market basket
# Writes indicators/macro/regime_data.json (read by darius_dale_regime.html).

on:
  schedule:
    - cron: '0 9 * * 1'    # Every Monday at 9:00 AM UTC
  workflow_dispatch:        # Allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  regime-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Compute regime
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python fetch_regime.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add indicators/macro/regime_data.json
          if git diff --staged --quiet; then
            echo "No regime change to commit"
          else
            git commit -m "Weekly regime compass update $(date +'%m/%d/%Y')"
            git push
          fi
