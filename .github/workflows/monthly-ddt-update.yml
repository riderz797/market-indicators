name: Monthly DDT Update

# Runs on the 5th and the 20th of every month.
# The 5th catches IMF International Liquidity + COFER (quarterly, released
# end of the month after quarter close) and the latest dollar-index month;
# the 20th catches Treasury TIC (published mid-month with a ~6-week lag).

on:
  schedule:
    - cron: '0 10 5 * *'    # 5th of every month at 10:00 AM UTC
    - cron: '0 10 20 * *'   # 20th of every month at 10:00 AM UTC
  workflow_dispatch:         # Allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  ddt-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Dollar Debasement Tracking update
        run: python fetch_ddt.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add indicators/macro/dollar_debasement_tracking.html
          if git diff --staged --quiet; then
            echo "No new DDT data available yet"
          else
            git commit -m "Monthly DDT update $(date +'%m/%d/%Y')"
            git push
          fi
