name: Daily Move Update

# Refreshes the Daily Move in Historical Distribution boards every day at
# 22:30 UTC — after the US equity close and the ICE dollar-index settlement.
# Weekend runs still pick up Bitcoin (24/7) and any LBMA gold catch-up.

on:
  schedule:
    - cron: '30 22 * * *'    # daily at 10:30 PM UTC
  workflow_dispatch:          # Allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  daily-move-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Daily Move update
        run: python fetch_daily_move.py

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add indicators/macro/daily_move_distribution.html
          if git diff --staged --quiet; then
            echo "No new daily move data"
          else
            git commit -m "Daily move update $(date +'%m/%d/%Y')"
            git push
          fi
